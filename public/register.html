<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Miksegram</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <h1>Miksegram</h1>
        <form onsubmit="event.preventDefault(); doRegister();">
            <div class="auth-field">
                <span class="prefix">@</span>
                <input id="login" name="login" class="has-prefix" placeholder="login" autocomplete="username">
            </div>
            <div class="auth-hint">Уникальный логин: a-z, 0-9, _ (3-32 символа)</div>
            <input id="display_name" name="display_name" placeholder="Отображаемое имя" autocomplete="nickname">
            <input id="password" name="password" type="password" placeholder="Пароль (мин. 4 символа)" autocomplete="new-password">
            <button type="button" id="btn">Создать аккаунт</button>
        </form>
        <div id="error" class="auth-error"></div>
        <div class="auth-link" style="position:relative; z-index:10;">Уже есть аккаунт? <a href="/login.html" style="color:var(--accent); text-decoration:underline;">Войти</a></div>
    </div>
</div>
<script src="/common.js"></script>
<script>
    async function doRegister() {
        const login = document.getElementById('login').value.trim();
        const display_name = document.getElementById('display_name').value.trim();
        const password = document.getElementById('password').value;
        const err = document.getElementById('error');
        err.textContent = '';
        const res = await fetch('/api/register', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ login, display_name, password })
        });
        const data = await res.json();
        if (data.ok) window.location.href = '/';
        else err.textContent = data.error;
    }
    
    document.getElementById('btn').addEventListener('click', doRegister);
    document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); });
</script>
</body>
</html>
