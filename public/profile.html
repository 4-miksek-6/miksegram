<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль — Miksegram</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="bg-layer"></div>
<div class="bg-blobs"><div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div><div class="blob blob-4"></div><div class="blob blob-5"></div></div>
<div class="bg-grid"></div>
<div class="stars" id="stars"></div>
<div class="grain"></div>

<div class="profile-page" style="max-width: 640px; margin: 0 auto; padding: 20px; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; position: relative; z-index: 1;">
    
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <button class="icon-btn" id="backBtn" title="Назад" style="background: rgba(255,255,255,0.1); border-radius: 50%;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </button>
        <button class="icon-btn" id="openSettingsBtn" title="Настройки" style="background: rgba(255,255,255,0.1); border-radius: 50%;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 10v6M4.2 4.2l4.3 4.3m7 7l4.3 4.3M1 12h6m10 0h6M4.2 19.8l4.3-4.3m7-7l4.3-4.3"/></svg>
        </button>
    </div>

    <!-- Баннер (карточка) -->
    <div class="profile-banner" id="profileBanner" style="height: 200px; border-radius: 24px; overflow: hidden; position: relative; box-shadow: var(--shadow-soft); background-size: cover; background-position: center;">
        <!-- Плавное затемнение вниз -->
        <div style="position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 30%, rgba(10,15,30,0.9) 100%);"></div>
        
        <!-- Аватарка и Имя внутри баннера -->
        <div style="position: absolute; bottom: 20px; left: 24px; right: 24px; display: flex; align-items: center; justify-content: space-between;">
            <div style="display: flex; align-items: center; gap: 16px;">
                <div class="avatar profile-avatar" id="profileAvatar" style="width: 80px; height: 80px; font-size: 32px; border: 3px solid rgba(255,255,255,0.2); box-shadow: 0 8px 24px rgba(0,0,0,0.5);">?</div>
                <div style="text-shadow: 0 2px 8px rgba(0,0,0,0.8);">
                    <div class="profile-name" id="profileName" style="font-family: 'Unbounded'; font-size: 24px; font-weight: 700; color: #fff; margin: 0;">...</div>
                    <div class="profile-login" id="profileLogin" style="font-size: 14px; color: rgba(255,255,255,0.7); margin-top: 2px; cursor: pointer;">@...</div>
                </div>
            </div>
        </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px;">
        <!-- О себе -->
        <div class="profile-bio-card" style="margin: 0; padding: 16px 20px; background: var(--panel-strong); border: 1px solid var(--border); border-radius: 20px; backdrop-filter: blur(20px);">
            <div class="profile-bio-label" style="font-family: 'Unbounded'; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-mute); margin-bottom: 8px;">О себе</div>
            <div class="profile-bio" id="profileBio" style="font-size: 14px; color: var(--text); line-height: 1.5;">...</div>
        </div>

        <!-- Будущая информация -->
        <div style="padding: 24px; background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 20px; text-align: center; color: var(--text-mute); font-size: 13px;">
            Тут будет другая информация в будущем
        </div>

        <button class="primary-btn profile-edit-btn" id="editProfileBtn" style="width: 100%; margin-top: 8px;">Редактировать профиль</button>
    </div>
</div>

<div class="modal-overlay" id="settingsModal">
    <div class="modal" style="width: 95vw; max-width: 1100px; height: 90vh; padding: 0; overflow: hidden; display: flex; flex-direction: column;">
        <div class="modal-header" style="padding: 16px 24px; border-bottom: 1px solid var(--border); margin: 0;">
            <h2 class="modal-title">Настройки</h2>
            <button class="icon-btn" id="closeSettings" title="Закрыть"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        </div>
        <div class="modal-body" id="settingsBody" style="padding: 0; flex: 1; overflow: hidden;"></div>
    </div>
</div>

<script src="/common.js"></script>
<script src="/settings.js"></script>
<script>
    initStars();
    initMagnetics();

    function renderProfile(u) {
        window.currentUser = u;
        applyAvatarTo(document.getElementById('profileAvatar'), u.avatar, u.display_name, u.avatar_frame);
        const nameEl = document.getElementById('profileName');
        nameEl.textContent = u.display_name;
        applyNameEffect(nameEl, u.name_effect);
        document.getElementById('profileLogin').textContent = '@' + u.login;
        document.getElementById('profileBio').textContent = u.bio || 'Пока ничего не рассказал(а) о себе';
        applyBannerTo(document.getElementById('profileBanner'), u.banner);
    }

    fetch('/api/me')
        .then(r => r.json())
        .then(data => {
            if (!data.ok) { window.location.href = '/login.html'; return; }
            renderProfile(data);
        })
        .catch(() => {
            showToast('Ошибка сети. Обнови страницу.');
        });

    window.onSettingsSaved = (u) => {
        renderProfile(u);
        if (typeof showToast === 'function') showToast('Профиль обновлён');
    };

    document.getElementById('backBtn').addEventListener('click', () => {
        if (document.referrer && document.referrer.includes(location.host)) history.back();
        else window.location.href = '/';
    });

    document.getElementById('editProfileBtn').addEventListener('click', openSettings);
    document.getElementById('openSettingsBtn').addEventListener('click', openSettings);

    document.getElementById('profileLogin').addEventListener('click', () => {
        if (window.currentUser) {
            navigator.clipboard.writeText('@' + window.currentUser.login).then(() => {
                showToast('Логин скопирован!');
            });
        }
    });

    const settingsModal = document.getElementById('settingsModal');
    function openSettings() { 
        if (typeof buildSettingsUI !== 'function') return showToast('Загрузка...');
        buildSettingsUI(); 
        settingsModal.classList.add('open'); 
    }
    function closeSettings() { settingsModal.classList.remove('open'); }
    document.getElementById('closeSettings').addEventListener('click', closeSettings);
    settingsModal.addEventListener('click', e => { if (e.target === settingsModal) closeSettings(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSettings(); });
</script>
</body>
</html>
