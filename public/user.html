<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль — Miksegram</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="bg-layer"></div>
<div class="bg-blobs"><div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div><div class="blob blob-4"></div><div class="blob blob-5"></div></div>
<div class="bg-grid"></div>
<div class="stars" id="stars"></div>
<div class="grain"></div>

<div class="profile-page">
    <div class="profile-topbar">
        <button class="icon-btn" id="backBtn" title="Назад"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
    </div>
    
    <div class="profile-banner" id="profileBanner">
        <div class="profile-banner-overlay"></div>
        <div class="profile-header-overlay">
            <div class="profile-avatar-wrap"><div class="avatar profile-avatar" id="profileAvatar">?</div></div>
            <div class="profile-title-wrap">
                <div class="profile-name" id="profileName">...</div>
                <div class="profile-login" id="profileLogin" style="cursor:pointer">@...</div>
            </div>
        </div>
    </div>

    <div class="profile-content">
        <div class="profile-bio-card">
            <div class="profile-bio-label">О себе</div>
            <div class="profile-bio" id="profileBio">—</div>
        </div>
        <button class="primary-btn profile-edit-btn" id="writeMsgBtn">Написать сообщение</button>
    </div>
</div>

<script src="/common.js"></script>
<script>
    initStars();
    initMagnetics();

    const userId = window.location.pathname.split('/').pop();
    let userData = null;

    if (!userId || isNaN(parseInt(userId))) {
        window.location.href = '/';
    }

    fetch('/api/user/' + userId)
        .then(r => r.json())
        .then(data => {
            if (!data.ok) { 
                window.location.href = '/'; 
                return; 
            }
            userData = data.user;
            
            applyAvatarTo(document.getElementById('profileAvatar'), userData.avatar, userData.display_name, userData.avatar_frame);
            
            const nameEl = document.getElementById('profileName');
            nameEl.textContent = userData.display_name;
            applyNameEffect(nameEl, userData.name_effect);
            
            document.getElementById('profileLogin').textContent = '@' + userData.login;
            document.getElementById('profileBio').textContent = userData.bio || 'Пока ничего не рассказал(а) о себе';
            applyBannerTo(document.getElementById('profileBanner'), userData.banner);
        })
        .catch(() => {
            showToast('Ошибка сети. Попробуй обновить страницу.');
        });

    document.getElementById('backBtn').addEventListener('click', () => {
        if (document.referrer && document.referrer.includes(location.host)) history.back();
        else window.location.href = '/';
    });
    
    document.getElementById('writeMsgBtn').addEventListener('click', () => {
        window.location.href = '/?write_to=' + userId;
    });

    document.getElementById('profileLogin').addEventListener('click', () => {
        if (userData) {
            navigator.clipboard.writeText('@' + userData.login).then(() => {
                showToast('Логин скопирован!');
            });
        }
    });
</script>
</body>
</html>
